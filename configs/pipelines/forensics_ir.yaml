pipelines:
  forensics_ir:
    routing: type_driven
    enabled: true
    steps:
      - id: analyze_topology
        uses: analyzer/analyze_topology
        where: "triage_passed == true and detected_format > 0"
        outputs:
          ir_unreferenced_slack:
            datasource: pipeline_memory
          audit_findings:
            datasource: audit_db

      - id: check_r02_trailing_overlay
        uses: analyzer/check_r02_trailing_overlay
        where: "triage_passed == true and detected_format > 0"
        params:
          entropy_threshold: 7.2
          allow_truncate: true
        outputs:
          audit_findings:
            datasource: audit_db
          truncate_orders:
            datasource: pipeline_memory
          quarantine_orders:
            datasource: pipeline_memory

      - id: check_r04_sample_bounds
        uses: analyzer/check_r04_sample_bounds
        where: "triage_passed == true and detected_format > 0"
        params:
          quarantine_on_fail: true
        outputs:
          audit_findings:
            datasource: audit_db
          quarantine_orders:
            datasource: pipeline_memory

      - id: check_r05_external_refs
        uses: analyzer/check_r05_external_refs
        where: "triage_passed == true and detected_format > 0"
        params:
          quarantine_on_fail: true
        outputs:
          audit_findings:
            datasource: audit_db
          quarantine_orders:
            datasource: pipeline_memory

      - id: check_r06_embedded_attachments
        uses: analyzer/check_r06_embedded_attachments
        where: "triage_passed == true and detected_format > 0"
        params:
          quarantine_on_fail: true
        outputs:
          audit_findings:
            datasource: audit_db
          quarantine_orders:
            datasource: pipeline_memory

      - id: check_r07_suspicious_padding
        uses: analyzer/check_r07_suspicious_padding
        where: "triage_passed == true and detected_format > 0"
        concurrency: max
        params:
          entropy_threshold: 7.2
        outputs:
          audit_findings:
            datasource: audit_db
          zero_out_orders:
            datasource: pipeline_memory
          quarantine_orders:
            datasource: pipeline_memory

      - id: check_r08_unreferenced_slack
        uses: analyzer/check_r08_unreferenced_slack
        where: "triage_passed == true and detected_format > 0"
        concurrency: max
        params:
          entropy_threshold: 7.2
          large_slack_bytes: 4096
        outputs:
          audit_findings:
            datasource: audit_db
          zero_out_orders:
            datasource: pipeline_memory
          quarantine_orders:
            datasource: pipeline_memory

      - id: check_r09_codec_inconsistencies
        uses: analyzer/check_r09_codec_inconsistencies
        where: "triage_passed == true and detected_format > 0"
        params:
          max_dimension: 16384
        outputs:
          audit_findings:
            datasource: audit_db

      - id: check_r10_sample_overlaps
        uses: analyzer/check_r10_sample_overlaps
        where: "triage_passed == true and detected_format > 0"
        params:
          max_amplification_ratio: 1.0
          quarantine_on_fail: true
        outputs:
          audit_findings:
            datasource: audit_db
          quarantine_orders:
            datasource: pipeline_memory

