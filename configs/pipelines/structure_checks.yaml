pipelines:
  structure_checks:
    routing: type_driven
    enabled: true
    steps:
      - id: check_mp4_structure
        uses: analyzer/check_mp4_structure
        where: "triage_passed == true and detected_family == 'isobmff' and (isobmff_valid == false or atoms_valid == true or atoms_valid == false)"
        outputs:
          mp4_structure_valid:
            datasource: pipeline_memory
          audit_findings:
            datasource: audit_db
            append:
              file_id: open_input_file.input_files.file_id

      - id: check_ebml_elements
        uses: analyzer/check_ebml_elements
        where: "triage_passed == true and detected_family == 'ebml'"
        outputs:
          audit_findings:
            datasource: audit_db
            append:
              file_id: open_input_file.input_files.file_id

      - id: check_mkv_tracks
        uses: analyzer/check_mkv_tracks
        where: "triage_passed == true and detected_family == 'ebml'"
        outputs:
          audit_findings:
            datasource: audit_db
            append:
              file_id: open_input_file.input_files.file_id

      - id: check_mkv_cues
        uses: analyzer/check_mkv_cues
        where: "triage_passed == true and detected_family == 'ebml' and mkv_cues.__count__ > 0"
        outputs:
          audit_findings:
            datasource: audit_db
            append:
              file_id: open_input_file.input_files.file_id

      - id: check_mkv_lacing
        uses: analyzer/check_mkv_lacing
        where: "triage_passed == true and detected_family == 'ebml' and mkv_lacing_anomalies.__count__ > 0"
        outputs:
          audit_findings:
            datasource: audit_db
            append:
              file_id: open_input_file.input_files.file_id

      - id: check_avi_structure
        uses: analyzer/check_avi_structure
        where: "triage_passed == true and detected_family == 'riff'"
        outputs:
          avi_structure_valid:
            datasource: pipeline_memory
          audit_findings:
            datasource: audit_db
            append:
              file_id: open_input_file.input_files.file_id

