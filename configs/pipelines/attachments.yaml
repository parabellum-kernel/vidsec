pipelines:
  attachments:
    routing: type_driven
    enabled: true
    steps:
      - id: check_r06_embedded_attachments
        uses: analyzer/check_r06_embedded_attachments
        where: "triage_passed == true and detected_format > 0 and ir_attachments.__count__ > 0"
        params:
          quarantine_on_fail: true
        outputs:
          audit_findings:
            datasource: audit_db
            append:
              file_id: open_input_file.input_files.file_id
          quarantine_orders:
            datasource: pipeline_memory
