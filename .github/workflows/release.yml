name: Release VidSec Portable

on:
  workflow_dispatch:

env:
  ZIG_VERSION: "0.17.1"

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            profile: linux
            archive: vidsec-*.tar.gz
          - os: macos-15
            profile: macos
            archive: vidsec-*.tar.gz
          - os: windows-latest
            profile: windows
            archive: vidsec-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ vars.ZIG_VERSION || env.ZIG_VERSION }}

      - name: Package portable bundle
        shell: bash
        run: ./scripts/package-release.sh ${{ matrix.profile }}

      - name: Publish assets to vidsec Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zig-out/release/${{ matrix.archive }}
            zig-out/release/*.sha256
